<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manutenzione in corso</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Inter, Arial, sans-serif;
      background: #0b0b0d;
      color: #fff;
      text-align: center;
      padding: 24px;
    }
    .card {
      width: min(620px, 100%);
      padding: 52px 34px;
      border: 1px solid #29292e;
      border-radius: 20px;
      background: #121216;
      box-shadow: 0 20px 70px rgba(0,0,0,.35);
    }
    .icon {
      width: 76px;
      height: 76px;
      margin: 0 auto 26px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #1d1d23;
      font-size: 36px;
    }
    h1 {
      margin: 0 0 16px;
      font-size: clamp(30px, 6vw, 46px);
      line-height: 1.1;
    }
    p {
      margin: 0 auto;
      max-width: 500px;
      color: #b8b8c0;
      font-size: 17px;
      line-height: 1.65;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-top: 30px;
      padding: 10px 16px;
      border-radius: 999px;
      background: #1b1b20;
      color: #d8d8df;
      font-size: 14px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f0b429;
    }
    .footer {
      margin-top: 34px;
      color: #6f6f78;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">🔧</div>
    <h1>Sito in manutenzione</h1>
    <p>
      Stiamo effettuando alcuni aggiornamenti per migliorare il servizio.
      Torneremo online il prima possibile.
    </p>
    <div class="status">
      <span class="dot"></span>
      Manutenzione in corso
    </div>
    <div class="footer">Grazie per la pazienza.</div>
  </main>
</body>
</html>
